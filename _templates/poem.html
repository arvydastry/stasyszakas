<article class="poem-pair">
  <div class="poem-pair__text"><h2 class="poem-pair__title">{{w.poem_heading}}</h2><div class="poem">{{w.poem_html}}</div></div>
  <a class="poem-pair__img" href="{{w.url}}"><img src="{{w.img960}}" srcset="{{w.srcset}}" sizes="(min-width:1000px) 42vw, 90vw" alt="{{w.alt}}" loading="lazy" style="max-width:min(100%,{{w.max_w}}px)"><span>{{w.title_display}}<!--if w.meta_line-->, {{w.meta_line}}<!--/if--></span></a>
</article>
