<article class="stack__item">
  <a class="stack__card" href="{{w.url}}" data-view>
    <img src="{{w.img1600}}" srcset="{{w.srcset}}" sizes="100vw" alt="{{w.alt}}" loading="lazy" style="object-position:{{w.focus}}">
    <span class="stack__meta"><span class="pill">{{w.category_label}}</span><span class="stack__date">{{w.meta_line}}</span></span>
    <h2 class="stack__title">{{w.title_display}}</h2>
  </a>
</article>
