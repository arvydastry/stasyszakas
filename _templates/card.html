<a class="card" href="{{w.url}}" data-cat="{{w.category}}">
  <span class="card__img" style="aspect-ratio:{{w.ratio}}"><img src="{{w.img480}}" srcset="{{w.srcset}}" sizes="(min-width:1000px) 32vw, 46vw" alt="{{w.alt}}" loading="lazy" decoding="async"></span>
  <span class="card__title"><span>{{w.title_display}}</span></span>
  <span class="card__meta"><!--if w.meta_line-->{{w.meta_line}}<!--/if--><!--unless w.meta_line-->{{w.category_label}}<!--/unless--><!--if w.sale_label--> · {{w.sale_label}}<!--/if--></span>
</a>
