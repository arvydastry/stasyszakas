<section class="row page-head">
  <h1 class="split-heading" data-split>Kūryba</h1>
  <p class="rtext-lg" data-reveal>{{works_label}}. Aliejus, akrilas, akvarelė, pastelė.</p>
</section>
<section class="row gallery" data-salient="Post Loop Builder: Portfolio, Grid masonry, category filters, content under image, Load More">
  <div class="filters" role="group" aria-label="Temos"><button class="filter is-active" type="button" data-filter="all" aria-pressed="true">Visi <sup>{{count:all}}</sup></button>{{block:filters}}</div>
  <p class="gallery__count" aria-live="polite"></p>
  <div class="grid-works" id="galerija">{{block:works_grid}}</div>
  <button class="btn-pill btn-pill--ghost btn-more" type="button">Rodyti daugiau</button>
</section>
<section class="row cta" data-salient="Row: Responsive Text (h2) + Nectar Button">
  <h2 class="h-lg" data-reveal>{{site.cta.title}}</h2>
  <p class="cta__text" data-reveal>{{site.cta.text}}</p>
  <a class="btn-pill" href="{{root}}kontaktai.html">Susisiekti</a>
</section>
